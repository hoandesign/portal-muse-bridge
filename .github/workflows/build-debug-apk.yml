name: Build Debug APK

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore shared debug keystore (preserves Portal install signature)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          ANDROID_USER_HOME="$HOME/.android"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_USER_HOME"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_USER_HOME/debug.keystore"
            chmod 600 "$ANDROID_USER_HOME/debug.keystore"
            KS_SHA256=$(keytool -list -v -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android | awk '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}')
            echo "EXPECTED_APK_SHA256=$KS_SHA256" >> "$GITHUB_ENV"
            echo "Restored shared debug.keystore (SHA-256 prefix: ${KS_SHA256:0:12})"
          else
            echo "DEBUG_KEYSTORE_BASE64 not set; using ephemeral runner debug.keystore"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon
          if [ -n "${EXPECTED_APK_SHA256:-}" ]; then
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
            ACTUAL_SHA256=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | awk '/SHA-256 digest:/{print tolower($NF); exit}')
            echo "APK cert SHA-256 prefix: ${ACTUAL_SHA256:0:12}"
            if [ "$ACTUAL_SHA256" != "$EXPECTED_APK_SHA256" ]; then
              echo "::error::APK signing cert ($ACTUAL_SHA256) does not match restored debug.keystore ($EXPECTED_APK_SHA256)"
              exit 1
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish rolling dev-latest pre-release
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Automated debug build from \`${GITHUB_REF_NAME}\` (\`${SHORT_SHA}\`).

          Install on Mac via USB:
          \`\`\`bash
          gh release download dev-latest -R ${GITHUB_REPOSITORY} -p app-debug.apk --clobber -D /tmp && adb install -r /tmp/app-debug.apk
          \`\`\`"

          if gh release view dev-latest >/dev/null 2>&1; then
            gh release upload dev-latest "$APK_PATH" --clobber
            gh release edit dev-latest --target "$GITHUB_SHA" --notes "$NOTES"
          else
            gh release create dev-latest "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Dev Latest (Debug APK)" \
              --notes "$NOTES"
          fi
